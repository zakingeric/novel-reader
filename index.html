<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NovelHub — Free Books</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- HEADER -->

  <header class="header">

    <div class="logo">
      Novel<span>Hub</span>
    </div>

    <nav class="nav">

      <button id="libraryBtn" class="nav-btn">
        My Library
      </button>

      <button id="authBtn" class="nav-btn">
        Sign in
      </button>

      <button id="themeBtn" class="theme-btn">
        ☾
      </button>

    </nav>

  </header>


  <main>

    <!-- HERO -->

    <section class="hero">

      <div class="hero-content">

        <p class="eyebrow">
          READ FOR FREE
        </p>

        <h1>
          Discover your next<br>
          great story.
        </h1>

        <p class="hero-text">
          Search thousands of public-domain books
          and read them instantly online.
        </p>

        <div class="search-box">

          <input
            type="text"
            id="searchInput"
            placeholder="Search books, authors..."
            autocomplete="off"
          >

          <button id="searchBtn">
            Search
          </button>

        </div>

      </div>

    </section>


    <!-- LIBRARY -->

    <section class="library">

      <div class="section-header">

        <h2 id="sectionTitle">
          Discover Books
        </h2>

        <span id="resultCount"></span>

      </div>


      <div id="books" class="books">

        <div class="loading">
          Search for a book to get started.
        </div>

      </div>

    </section>

  </main>


  <!-- AUTH MODAL -->

  <div id="authModal" class="modal hidden">

    <div class="modal-card">

      <button id="closeAuth" class="modal-close">
        ×
      </button>

      <h2 id="authTitle">
        Sign in
      </h2>

      <p id="authSubtitle">
        Sign in to save books and reading progress.
      </p>

      <form id="authForm">

        <input
          id="emailInput"
          type="email"
          placeholder="Email"
          required
        >

        <input
          id="passwordInput"
          type="password"
          placeholder="Password"
          minlength="6"
          required
        >

        <button type="submit" class="primary-btn">
          <span id="authSubmitText">
            Sign in
          </span>
        </button>

      </form>

      <p id="authMessage" class="auth-message"></p>

      <button id="toggleAuth" class="switch-auth">
        Don't have an account? Sign up
      </button>

    </div>

  </div>


  <!-- READER -->

  <div id="reader" class="reader hidden">

    <div class="reader-header">

      <button id="closeReader">
        ← Back
      </button>

      <span id="readerTitle">
        Reading
      </span>

      <div class="reader-controls">

        <button id="bookmarkBtn" title="Bookmark">
          🔖
        </button>

        <button id="decreaseFont">
          A−
        </button>

        <button id="increaseFont">
          A+
        </button>

      </div>

    </div>


    <article
      id="readerContent"
      class="reader-content"
    >

      <div class="reader-loading">
        Loading book...
      </div>

    </article>

  </div>


  <script src="app.js"></script>

</body>
</html>    </div>

      <div class="reader-loading">
        Loading book...
      </div>

    </article>

  </div>


  <script src="app.js"></script>

</body>
</html>
